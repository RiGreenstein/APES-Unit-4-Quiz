<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>APES Unit 4 Quiz – Earth Systems & Resources</title>
<style>
  :root {
    --bg: #0f1e17; --card: #ffffff; --accent: #2e8b57; --accent-dark: #1f6b41;
    --text: #1d2a22; --muted: #5d6b63; --correct: #2e9e5b; --wrong: #d64545;
    --correct-bg: #e5f6ec; --wrong-bg: #fbe9e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f1e17 0%, #1d3b2c 50%, #234a5e 100%);
    color: var(--text); display: flex; justify-content: center; align-items: flex-start; padding: 32px 16px;
  }
  .card {
    background: var(--card); width: 100%; max-width: 760px; border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35); padding: 32px; animation: fade .3s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  h1 { margin: 0 0 6px; font-size: 1.9rem; color: var(--accent-dark); }
  h2 { margin: 0 0 16px; font-size: 1.25rem; line-height: 1.45; }
  .subtitle { color: var(--muted); margin: 0 0 22px; }
  .topics { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip { background: #eaf4ee; color: var(--accent-dark); padding: 5px 11px; border-radius: 999px; font-size: .85rem; }
  label.opt-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: var(--muted); cursor: pointer; }
  select { padding: 6px 10px; border-radius: 8px; border: 1px solid #ccd; font-size: 1rem; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 12px 22px;
    background: var(--accent); color: #fff; font-weight: 600; transition: background .15s, transform .1s;
  }
  button:hover:not(:disabled) { background: var(--accent-dark); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: #e8ecea; color: var(--text); }
  button.secondary:hover { background: #d6ddd9; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: .9rem; color: var(--muted); margin-bottom: 8px; }
  .progress { height: 8px; background: #e6ece8; border-radius: 99px; overflow: hidden; margin-bottom: 22px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .topic-tag { display: inline-block; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
  .choices { display: grid; gap: 10px; }
  .choice {
    text-align: left; background: #f5f8f6; color: var(--text); border: 2px solid #e1e8e4;
    font-weight: 500; display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px;
  }
  .choice:hover:not(:disabled) { background: #eaf4ee; border-color: var(--accent); }
  .choice .letter {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: #dfe8e3;
    display: grid; place-items: center; font-weight: 700; font-size: .85rem;
  }
  .choice.correct { background: var(--correct-bg); border-color: var(--correct); }
  .choice.correct .letter { background: var(--correct); color: #fff; }
  .choice.wrong { background: var(--wrong-bg); border-color: var(--wrong); }
  .choice.wrong .letter { background: var(--wrong); color: #fff; }
  .choice:disabled { cursor: default; opacity: 1; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; line-height: 1.5; display: none; }
  .feedback.show { display: block; animation: fade .25s; }
  .feedback.good { background: var(--correct-bg); border-left: 5px solid var(--correct); }
  .feedback.bad { background: var(--wrong-bg); border-left: 5px solid var(--wrong); }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .score-big { font-size: 3.2rem; font-weight: 800; color: var(--accent-dark); margin: 6px 0; }
  .grade { font-size: 1.1rem; margin-bottom: 20px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin: 12px 0 22px; font-size: .95rem; }
  th, td { padding: 8px 6px; border-bottom: 1px solid #e6ece8; text-align: left; }
  td.num { text-align: right; white-space: nowrap; }
  .bar { height: 6px; background: #e6ece8; border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; }
  .review-item { border: 1px solid #e6ece8; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .review-item p { margin: 6px 0; }
  .review-item .yours { color: var(--wrong); }
  .review-item .right { color: var(--correct); font-weight: 600; }
  .review-item .exp { color: var(--muted); font-size: .93rem; }
  .hidden { display: none; }
  kbd { background: #eef; border-radius: 4px; padding: 1px 5px; font-size: .8rem; border: 1px solid #ccd; }
  @media (max-width: 520px) { .card { padding: 22px; } h1 { font-size: 1.5rem; } }
</style>
</head>

const LETTERS = "ABCD";
const app = document.getElementById("app");
let state = {};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  document.getElementById("startBtn").onclick = () => {
    const topic = document.getElementById("topic").value;
    let pool = topic === "all" ? QUESTIONS : QUESTIONS.filter(q => q.topic === topic);
    if (document.getElementById("shuffleQ").checked) pool = shuffle(pool);
    pool = pool.slice(0, +document.getElementById("count").value);
    const shuffleA = document.getElementById("shuffleA").checked;
    startQuiz(pool, shuffleA);
  };
}

function startQuiz(pool, shuffleA) {
  const questions = pool.map(q => {
    const order = shuffleA ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3];
    return { ...q, choices: order.map(i => q.choices[i]), answer: order.indexOf(q.answer) };
  });
  state = { questions, idx: 0, answers: [], pool, shuffleA };
  renderQuestion();
}

function renderQuestion() {
  const { questions, idx } = state;
  const q = questions[idx];
  const score = state.answers.filter((a, i) => a === questions[i].answer).length;
  app.innerHTML = `
    <div class="top-bar"><span>Question ${idx + 1} of ${questions.length}</span><span>Score: ${score}</span></div>
    <div class="progress"><div style="width:${(idx / questions.length) * 100}%"></div></div>
    <span class="topic-tag">${esc(q.topic)}</span>
    <h2>${esc(q.q)}</h2>
    <div class="choices">
      ${q.choices.map((c, i) => `<button class="choice" data-i="${i}"><span class="letter">${LETTERS[i]}</span><span>${esc(c)}</span></button>`).join("")}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="actions">
      <button class="secondary" id="quitBtn">Quit</button>
      <button id="nextBtn" disabled>${idx === questions.length - 1 ? "See Results" : "Next →"}</button>
    </div>`;
  app.querySelectorAll(".choice").forEach(b => b.onclick = () => choose(+b.dataset.i));
  document.getElementById("nextBtn").onclick = next;
  document.getElementById("quitBtn").onclick = () => { if (confirm("Quit and see results so far?")) renderResults(); };
}

function choose(i) {
  if (state.answers[state.idx] !== undefined) return;
  const q = state.questions[state.idx];
  state.answers[state.idx] = i;
  const btns = app.querySelectorAll(".choice");
  btns.forEach(b => b.disabled = true);
  btns[q.answer].classList.add("correct");
  const correct = i === q.answer;
  if (!correct) btns[i].classList.add("wrong");
  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (correct ? "good" : "bad");
  fb.innerHTML = `<strong>${correct ? "✅ Correct!" : `❌ Incorrect — the answer is ${LETTERS[q.answer]}.`}</strong><br>${esc(q.exp)}`;
  const nb = document.getElementById("nextBtn");
  nb.disabled = false; nb.focus();
  const score = state.answers.filter((a, k) => a === state.questions[k].answer).length;
  app.querySelector(".top-bar span:last-child").textContent = "Score: " + score;
}

function next() {
  if (state.answers[state.idx] === undefined) return;
  if (state.idx < state.questions.length - 1) { state.idx++; renderQuestion(); }
  else renderResults();
}

function renderResults() {
  const { questions, answers } = state;
  const answered = answers.filter(a => a !== undefined).length;
  const correct = questions.filter((q, i) => answers[i] === q.answer).length;
  const pct = answered ? Math.round((correct / answered) * 100) : 0;
  const msg = pct >= 90 ? "🏆 Outstanding — you're ready for the AP exam!"
    : pct >= 75 ? "🌱 Great work! Review the few you missed."
    : pct >= 60 ? "📚 Solid start — focus on your weaker topics below."
    : "🔁 Keep studying! Review the explanations and try again.";

  const byTopic = {};
  questions.forEach((q, i) => {
    if (answers[i] === undefined) return;
    byTopic[q.topic] ??= { c: 0, t: 0 };
    byTopic[q.topic].t++;
    if (answers[i] === q.answer) byTopic[q.topic].c++;
  });

  const missed = questions.map((q, i) => ({ q, a: answers[i] })).filter(x => x.a !== undefined && x.a !== x.q.answer);

  app.innerHTML = `
    <h1>Results</h1>
    <div class="score-big">${correct} / ${answered}</div>
    <div class="grade">${pct}% &nbsp;·&nbsp; ${msg}</div>
    <h2>Breakdown by topic</h2>
    <table>
      ${Object.entries(byTopic).map(([t, v]) => {
        const p = Math.round(v.c / v.t * 100);
        const color = p >= 75 ? "var(--correct)" : p >= 50 ? "#e0a020" : "var(--wrong)";
        return `<tr><td>${esc(t)}<div class="bar"><div style="width:${p}%;background:${color}"></div></div></td><td class="num">${v.c}/${v.t} (${p}%)</td></tr>`;
      }).join("")}
    </table>
    <div class="actions" style="justify-content:flex-start;flex-wrap:wrap">
      ${missed.length ? `<button id="retryMissed">Retry missed (${missed.length})</button>` : ""}
      <button id="retryAll">Retake quiz</button>
      <button class="secondary" id="home">Home</button>
    </div>
    ${missed.length ? `<h2 style="margin-top:28px">Review missed questions</h2>
      ${missed.map(({ q, a }) => `
        <div class="review-item">
          <span class="topic-tag">${esc(q.topic)}</span>
          <p><strong>${esc(q.q)}</strong></p>
          <p class="yours">Your answer: ${esc(q.choices[a])}</p>
          <p class="right">Correct: ${esc(q.choices[q.answer])}</p>
          <p class="exp">${esc(q.exp)}</p>
        </div>`).join("")}` : `<p style="margin-top:24px">🎉 No missed questions — perfect score!</p>`}`;

  if (missed.length) document.getElementById("retryMissed").onclick = () => {
    const originals = missed.map(m => QUESTIONS.find(o => o.q === m.q.q));
    startQuiz(shuffle(originals), state.shuffleA);
  };
  document.getElementById("retryAll").onclick = () => startQuiz(shuffle(state.pool), state.shuffleA);
  document.getElementById("home").onclick = renderStart;
}

document.addEventListener("keydown", e => {
  if (!state.questions || !document.querySelector(".choice")) return;
  const k = e.key.toUpperCase();
  const map = { "1": 0, "2": 1, "3": 2, "4": 3, A: 0, B: 1, C: 2, D: 3 };
  if (k in map) choose(map[k]);
  else if (e.key === "Enter" && state.answers[state.idx] !== undefined) { e.preventDefault(); next(); }
});

renderStart();
</script>
</body>
</html>
